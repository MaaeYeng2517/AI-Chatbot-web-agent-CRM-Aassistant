<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login / Signup</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<nav>
  <div class="container">
    <div>OnlineCourse</div>
    <div>
      <button onclick="window.location.href='index.html'">Home</button>
    </div>
  </div>
</nav>

<section id="signup" class="active" style="display:flex; justify-content:center; align-items:center; min-height:100vh;">
  <div style="background:white; padding:2rem; border-radius:8px; max-width:400px; width:100%;">
    <h2 style="text-align:center; margin-bottom:1rem;">Login / Signup</h2>
    <form>
      <input type="email" placeholder="Email" style="width:100%; padding:0.5rem; margin-bottom:0.5rem; border-radius:4px; border:1px solid #ccc;"><br>
      <input type="password" placeholder="Password" style="width:100%; padding:0.5rem; margin-bottom:0.5rem; border-radius:4px; border:1px solid #ccc;"><br>
      <button type="submit" class="primary" style="width:100%;">Login / Sign Up</button>
    </form>
    <div style="text-align:center; margin-top:1rem;">
      <button class="primary" style="background:#db4437; margin-right:0.5rem;">Google</button>
      <button class="primary" style="background:#1877f2; margin-right:0.5rem;">Facebook</button>
      <button class="primary" style="background:#00c300;">Line</button>
    </div>
  </div>
</section>

<script src="assets/js/main.js"></script>
</body>
</html>
