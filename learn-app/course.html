<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OnlineCourse Home</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
body { font-family: Arial, sans-serif; margin:0; padding:0; background:#f3f4f6; }
.container { max-width:1080px; margin:auto; padding:1rem; }

nav { background:#2563eb; color:white; padding:1rem; display:flex; justify-content:space-between; align-items:center; }
nav button { background:white; color:#2563eb; border:none; padding:0.5rem 1rem; border-radius:6px; cursor:pointer; margin-left:0.5rem; }

h1, h2, h3 { margin:0.5rem 0; }
button.primary { background:#2563eb; color:white; border:none; padding:0.6rem 1.2rem; border-radius:6px; cursor:pointer; }

.course-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:1rem; }
.course-card { background:white; padding:1rem; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.1); transition:transform 0.2s; }
.course-card:hover { transform:translateY(-5px); }
.course-card img { width:100%; border-radius:6px; margin-bottom:0.5rem; }
.course-card h4 { margin-bottom:0.3rem; }
.signup-form { background:white; padding:2rem; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.1); max-width:400px; margin:auto; }
.signup-form input { width:100%; padding:0.6rem; margin-bottom:1rem; border-radius:6px; border:1px solid #ccc; }
</style>
</head>
<body>

<nav>
  <div>OnlineCourse</div>
  <div>
    <button onclick="window.location.href='index.html'">Home</button>
    <button onclick="window.location.href='student-dashboard.html'">Dashboard</button>
  </div>
</nav>

<section class="container" style="margin-top:2rem;">
  <!-- Section 1: Course List -->
  <h2>Our Courses</h2>
  <div class="course-grid" id="course-grid"></div>
</section>

<section class="container" style="margin-top:3rem;">
  <!-- Section 2: Signup -->
  <h2>Sign Up for Free</h2>
  <div class="signup-form">
    <input type="text" id="signup-name" placeholder="Full Name">
    <input type="email" id="signup-email" placeholder="Email">
    <input type="password" id="signup-password" placeholder="Password">
    <button class="primary" onclick="signupUser()">Sign Up</button>
  </div>
</section>

<script src="assets/js/main.js"></script>
<script>
// ===== Sample Courses =====
let courses = JSON.parse(localStorage.getItem('courses')||'[]');
if(courses.length===0){
  courses = [];
  for(let i=1;i<=6;i++){
    courses.push({
      id:i,
      title:`Course ${i} - React Topic ${i}`,
      price:49 + i*10,
      image:`https://picsum.photos/seed/course${i}/300/150`
    });
  }
  localStorage.setItem('courses', JSON.stringify(courses));
}

// ===== Render Course Cards =====
const grid = document.getElementById('course-grid');
courses.forEach(c=>{
  const div = document.createElement('div');
  div.className='course-card';
  div.innerHTML = `
    <img src="${c.image}" alt="${c.title}">
    <h4>${c.title}</h4>
    <p>Price: $${c.price}</p>
    <button class="primary" onclick="enrollCourse(${c.id})">Enroll Now</button>
  `;
  grid.appendChild(div);
});

// ===== Enroll Demo =====
function enrollCourse(courseId){
  let currentUser = JSON.parse(localStorage.getItem('currentUser')||'{"name":"","enrolledCourses":[]}');
  currentUser.enrolledCourses = currentUser.enrolledCourses || [];
  if(!currentUser.enrolledCourses.includes(courseId)) currentUser.enrolledCourses.push(courseId);
  localStorage.setItem('currentUser', JSON.stringify(currentUser));
  alert('Enrolled in course! 🎉');
}

// ===== Signup Form =====
function signupUser(){
  const name = document.getElementById('signup-name').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const password = document.getElementById('signup-password').value.trim();
  if(!name || !email || !password){ alert('Fill all fields'); return; }

  let users = JSON.parse(localStorage.getItem('users')||'[]');
  if(users.find(u=>u.email===email)){ alert('Email already registered'); return; }

  users.push({name,email,password,enrolledCourses:[],notifications:[],role:'student'});
  localStorage.setItem('users', JSON.stringify(users));
  localStorage.setItem('currentUser', JSON.stringify({name,email,enrolledCourses:[],notifications:[],role:'student'}));
  alert('Sign Up Successful! 🎉');
}
</script>
</body>
</html>
