<!-- WALLET -->
<main id="wallet" class="p-4 hidden">
  <button onclick="goHome()" class="text-blue-500 text-sm mb-2">
    ← กลับ
  </button>

  <h2 class="text-xl font-bold mb-4">💰 กระเป๋าเหรียญ</h2>

  <p class="mb-3">
    เหรียญคงเหลือ:
    <span id="coinBalance" class="font-bold">0</span>
  </p>

  <div class="space-y-2">
    <button onclick="addCoin(30)"
      class="w-full bg-yellow-400 py-2 rounded">
      +30 เหรียญ (ตัวอย่าง)
    </button>

    <button onclick="addCoin(100)"
      class="w-full bg-yellow-500 py-2 rounded">
      +100 เหรียญ (ตัวอย่าง)
    </button>
  </div>

  <p class="text-xs text-gray-500 mt-4">
    * ตัวอย่างเท่านั้น ยังไม่ใช่การซื้อเงินจริง
  </p>
</main>
